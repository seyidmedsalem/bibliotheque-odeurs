; Firmware du nez électronique - La bibliothèque des odeurs
; Compiler : pio run        Téléverser : pio run -t upload        Moniteur : pio device monitor

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit BME680 Library@^2.0.5
    adafruit/Adafruit Unified Sensor@^1.1.14
    sensirion/Sensirion I2C SGP41@0.1.0
    sensirion/Sensirion Core@^0.7.1
    sensirion/Sensirion Gas Index Algorithm@^3.2.3
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    sparkfun/SparkFun Indoor Air Quality Sensor - ENS160 Arduino Library@^1.0.8
    mikalhart/TinyGPSPlus@^1.1.0

; Carte ESP32 classique (WROOM-32) : pio run -e esp32-classic
[env:esp32-classic]
extends = env:esp32-s3
board = esp32dev
build_flags =
